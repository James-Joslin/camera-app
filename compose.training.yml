services:
  azurite:
    command: azurite-blob --blobHost 0.0.0.0 --location /data --disableTelemetry --skipApiVersionCheck

  training:
    build:
      context: ./model_training
      dockerfile: Dockerfile.dev
    image: camera-software-training:dev
    working_dir: /workspace
    shm_size: 16g
    environment:
      TRAINING_STATE_ROOT: /workspace/output
      TRAINING_MODEL_VARIANT: ${TRAINING_MODEL_VARIANT:-clean_ltrb}
      TRAINING_VISIBLE_LOSS_WEIGHT: ${TRAINING_VISIBLE_LOSS_WEIGHT:-0}
      TRAINING_REPGT_LOSS_WEIGHT: ${TRAINING_REPGT_LOSS_WEIGHT:-0}
      TRAINING_REPBOX_LOSS_WEIGHT: ${TRAINING_REPBOX_LOSS_WEIGHT:-0}
      TRAINING_AUXILIARY_RAMP_EPOCHS: ${TRAINING_AUXILIARY_RAMP_EPOCHS:-5}
      TRAINING_REPGT_SIGMA: ${TRAINING_REPGT_SIGMA:-0.5}
      TRAINING_REPBOX_SIGMA: ${TRAINING_REPBOX_SIGMA:-0}
      TRAINING_REPBOX_PREDICTIONS_PER_GT: ${TRAINING_REPBOX_PREDICTIONS_PER_GT:-4}
      TRAINING_REPULSION_CHUNK_SIZE: ${TRAINING_REPULSION_CHUNK_SIZE:-64}
      TRAINING_CHECKPOINT_SELECTION: ${TRAINING_CHECKPOINT_SELECTION:-detection_loss}
      TRAINING_EPOCHS: ${TRAINING_EPOCHS:-100}
      TRAINING_AP_EVERY_N_EPOCHS: ${TRAINING_AP_EVERY_N_EPOCHS:-5}
      AZURITE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      AZURITE_ACCOUNT_NAME: ${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      AZURITE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
      AZURITE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURITE_DATA_CONTAINER: ${AZURITE_DATA_CONTAINER:-computer-vision-data}
    volumes:
      - ./model_training:/workspace
      - ${MODEL_OUTPUT_DIR:-./model_training/output}:/workspace/output
      - ./kaggle.json:/root/.kaggle/kaggle.json:ro
    depends_on:
      azurite:
        condition: service_healthy
