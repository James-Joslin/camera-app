services:
  azurite:
    command: azurite-blob --blobHost 0.0.0.0 --location /data --disableTelemetry --skipApiVersionCheck

  training-job:
    image: ${TRAINING_IMAGE:-camera-software-training:production}
    build:
      context: ./model_training
      dockerfile: Dockerfile.production
    restart: "no"
    shm_size: 16g
    environment:
      AZURITE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      AZURITE_ACCOUNT_NAME: ${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      AZURITE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
      AZURITE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURITE_DATA_CONTAINER: ${AZURITE_DATA_CONTAINER:-computer-vision-data}
      AZURITE_MODEL_CONTAINER: ${AZURITE_MODEL_CONTAINER:-computer-vision-models}
      AZURITE_MODEL_REMOTE_ROOT: ${AZURITE_MODEL_REMOTE_ROOT:-person_detector_ssd/releases}
      AZURITE_MODEL_CURRENT_POINTER: ${AZURITE_MODEL_CURRENT_POINTER:-person_detector_ssd/current.json}
      USE_AZURITE: "true"
      TRAINING_MODEL_VARIANT: ${TRAINING_MODEL_VARIANT:-clean_ltrb}
      TRAINING_EPOCHS: ${TRAINING_EPOCHS:-100}
      TRAINING_BATCH_SIZE: ${TRAINING_BATCH_SIZE:-32}
      TRAINING_NUM_WORKERS: ${TRAINING_NUM_WORKERS:-1}
      TRAINING_INPUT_HEIGHT: ${TRAINING_INPUT_HEIGHT:-360}
      TRAINING_INPUT_WIDTH: ${TRAINING_INPUT_WIDTH:-640}
      TRAINING_AP_EVERY_N_EPOCHS: ${TRAINING_AP_EVERY_N_EPOCHS:-5}
      TRAINING_AP_SCORE_THRESHOLD: ${TRAINING_AP_SCORE_THRESHOLD:-0.01}
      TRAINING_AP_NMS_THRESHOLD: ${TRAINING_AP_NMS_THRESHOLD:-0.5}
      TRAINING_AP_PRE_NMS_TOPK: ${TRAINING_AP_PRE_NMS_TOPK:-1000}
      TRAINING_AP_MAX_DETECTIONS: ${TRAINING_AP_MAX_DETECTIONS:-100}
      TRAINING_RECALL_FPPI: ${TRAINING_RECALL_FPPI:-0.1}
      TRAINING_TENSORBOARD_ENABLED: ${TRAINING_TENSORBOARD_ENABLED:-true}
      TRAINING_TENSORBOARD_LOG_DIR: ${TRAINING_TENSORBOARD_LOG_DIR:-tensorboard}
      MODEL_RELEASE_STATUS: ${MODEL_RELEASE_STATUS:-experimental}
      MIN_MAP_50: ${MIN_MAP_50:-0.25}
      MIN_MAP_50_95: ${MIN_MAP_50_95:-0.10}
      MIN_RECALL_FPPI: ${MIN_RECALL_FPPI:-0.20}
      CAMERA_DOMAIN_METRICS: ${CAMERA_DOMAIN_METRICS:-}
      BENCHMARK_SCORE_THRESHOLD: ${BENCHMARK_SCORE_THRESHOLD:-0.5}
      PRE_NMS_TOPK: ${PRE_NMS_TOPK:-1000}
      CALIBRATION_SAMPLES: ${CALIBRATION_SAMPLES:-300}
      VALIDATION_SAMPLES: ${VALIDATION_SAMPLES:-500}
      MAX_ACCURACY_DROP: ${MAX_ACCURACY_DROP:-0.01}
      BENCHMARK_ITERATIONS: ${BENCHMARK_ITERATIONS:-100}
      OPENVINO_THREADS: ${OPENVINO_THREADS:-1}
      CITYPERSONS_PREVIEW_COUNT: ${CITYPERSONS_PREVIEW_COUNT:-1}
      CITYPERSONS_DATASET_VERSION: ${CITYPERSONS_DATASET_VERSION:-}
      CITYPERSONS_RESUME_UPLOAD: ${CITYPERSONS_RESUME_UPLOAD:-false}
      TRAINING_RUN_ID: ${TRAINING_RUN_ID:-}
      MODEL_RELEASE_ID: ${MODEL_RELEASE_ID:-}
    volumes:
      - training-state:/state
      - ${KAGGLE_JSON_PATH:-./kaggle.json}:/root/.kaggle/kaggle.json:ro
    depends_on:
      azurite:
        condition: service_healthy

  training-tensorboard:
    image: ${TRAINING_IMAGE:-camera-software-training:production}
    restart: unless-stopped
    entrypoint: ["tensorboard"]
    command:
      - --logdir=/state/runs
      - --host=0.0.0.0
      - --port=6006
      - --reload_interval=10
    ports:
      - "${TENSORBOARD_BIND_ADDRESS:-127.0.0.1}:${TENSORBOARD_HOST_PORT:-6006}:6006"
    volumes:
      - training-state:/state:ro

volumes:
  training-state:
