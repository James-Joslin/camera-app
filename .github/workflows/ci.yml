name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r fastapi/requirements-dev.txt
      - run: PYTHONPATH=fastapi pytest -q fastapi/tests
      - run: python -m compileall -q fastapi/app project/azurite_compat.py project/optimize_model.py project/test_inference.py project/upload_to_azurite.py

  dotnet-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore api.Tests/cameraApi.Tests.csproj
      - run: dotnet build api/cameraApi.csproj --no-restore
      - run: dotnet test api.Tests/cameraApi.Tests.csproj --no-restore

  frontend-quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.dev.example -f compose.dev.yml config --quiet
      - run: docker compose --env-file .env.prod.example -f compose.prod.yml config --quiet

  image-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: api
            dockerfile: api/Dockerfile
          - name: fastapi
            context: fastapi
            dockerfile: fastapi/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: migrations
            context: migrations
            dockerfile: migrations/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: camera-software/${{ matrix.name }}:ci

  ci-gate:
    if: always()
    needs: [python-quality, dotnet-quality, frontend-quality, compose-validation, image-builds]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.python-quality.result }}" = success && test "${{ needs.dotnet-quality.result }}" = success && test "${{ needs.frontend-quality.result }}" = success && test "${{ needs.compose-validation.result }}" = success && test "${{ needs.image-builds.result }}" = success

