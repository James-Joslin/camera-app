name: Bug report
description: Report a reproducible problem in the camera platform.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please sanitize logs and never include footage, credentials, or kaggle.json."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Next.js frontend, ASP.NET API, FastAPI, ML/training/inference, Azurite, PostgreSQL/Alembic, Docker, CI/docs]
    validations: { required: true }
  - type: textarea
    id: description
    attributes:
      label: 'What happened?'
      description: Include expected and actual behavior.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include exact sanitized commands and inputs. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit or version }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Sanitized logs, render: shell }

